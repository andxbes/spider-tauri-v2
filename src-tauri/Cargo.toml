[package]
name = "spider-tauri"
version = "1.0.0"
description = "A web spider built with Tauri v2"
authors = ["andxbes <andxbes@gmail.com>"]
edition = "2021"

[lib]
name = "spider_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.23"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
rand = "0.8"
regex = "1"
once_cell = "1"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
